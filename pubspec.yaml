name: dj
description: HackDJ - a professional dual-deck DJ app built with Flutter and the SoLoud audio engine.
publish_to: "none"
version: 0.1.0+1

# Package / bundle namespace is io.surprise.dj. It is applied by
# `flutter create --org io.surprise --project-name dj .` (see scripts/bootstrap.sh)
# because org + project name => applicationId io.surprise.dj.
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^5.3.1   # low-latency engine: buses, filters, mixer capture
  file_picker: ^13.4.0     # import tracks / custom sampler sounds
  path_provider: ^2.1.5    # library + recordings storage
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The UI is built only on package:flutter/widgets.dart with custom painters,
  # so it does not depend on Material or Cupertino (being split out of the
  # Flutter SDK into separate packages).
  uses-material-design: false
