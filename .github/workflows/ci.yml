name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Native folders are generated, not committed: org io.surprise + project
      # name dj  =>  applicationId / namespace io.surprise.dj
      - name: Generate platform folders
        run: flutter create --org io.surprise --project-name dj --platforms=android,ios .

      # `flutter create` drops in the default counter-app test, which doesn't
      # match this app (MyApp, Icons, material_ui) and breaks analyze/test.
      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: hackdj-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk