name: CI

# Move this file to .github/workflows/ci.yml (the GitHub connector used to
# create the repo content is not allowed to write workflow files).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Native folders are generated, not committed: org io.surprise + project
      # name dj  =>  applicationId / namespace io.surprise.dj
      - name: Generate platform folders
        run: flutter create --org io.surprise --project-name dj --platforms=android,ios .

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: hackdj-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
